[project]
name = "datadoc"
version = "0.1.0"
description = "Deterministischer Kern des Datendokumentations-Assistenten: Profiling, Qualitätsregeln, PII-Maskierung, Export."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.7",
]

[project.scripts]
datadoc = "datadoc.cli:main"
datadoc-gui = "datadoc_gui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "faker>=30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datadoc", "src/datadoc_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
